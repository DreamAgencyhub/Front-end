name: "PR Template Selector"

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  contents: read

jobs:
  apply-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine and apply template
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branchName = context.payload.pull_request.head.ref;
             
            let templateFile = '';
            if (branchName.startsWith('feature/') || branchName.startsWith('feat/')) {
              templateFile = '.github/PULL_REQUEST_TEMPLATE/user-story-pr.md';
            } else if (branchName.startsWith('fix/') || branchName.startsWith('bugfix/') || branchName.startsWith('bug/')) {
              templateFile = '.github/PULL_REQUEST_TEMPLATE/bug-fix-pr.md';
            } else if (branchName.startsWith('tech/') || branchName.startsWith('chore/') || branchName.startsWith('refactor/')) {
              templateFile = '.github/PULL_REQUEST_TEMPLATE/tech-task-pr.md';
            }

            if (templateFile) {
              try {
                const template = fs.readFileSync(templateFile, 'utf8');
                const pr = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number
                });
                
                const newBody = template + '\n\n' + (pr.data.body || '');
                
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  body: newBody
                });
              } catch (error) {
                core.setFailed(`Failed to apply template: ${error.message}`);
              }
            }
